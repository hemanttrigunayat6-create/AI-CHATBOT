<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orbit AI | Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p>Sign in to continue</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">Sign Up</a>

            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
