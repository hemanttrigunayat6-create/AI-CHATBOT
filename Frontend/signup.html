<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orbit AI | Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="signup-box">

            <h1>Create Account</h1>

            <p>Join Orbit AI</p>

            <form id="signupForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    autocomplete="name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="new-password"
                    required
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">
                    Sign Up
                </button>

            </form>

            <div class="login-link">

                Already have an account?

                <a href="login.html">Login</a>

            </div>

        </div>

    </div>

    <script src="signup.js"></script>

</body>

</html>
