<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit AI</title>

    <link rel="stylesheet" href="chat.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">

            <i class="fa-solid fa-robot"></i>

            <h2>Orbit AI</h2>

        </div>

        <div class="profile">

            <span>K</span>

        </div>

    </header>


    <!-- Chat Area -->

    <main class="chat-box">

        <!-- Welcome Screen -->

        <div class="hero">

            <i class="fa-solid fa-robot hero-icon"></i>

            <h1>Hello, Kush 👋</h1>

            <p>
                I'm Orbit AI. Ask me anything about programming,
                studies, technology or anything else.
            </p>

        </div>

        <!-- Messages will be added here automatically -->

    </main>


    <!-- Input -->

    <div class="input-area">

        <input
            type="text"
            id="prompt"
            placeholder="Message Orbit AI..."
            autocomplete="off"
        >

        <button id="sendBtn">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="chat.js"></script>

</body>
</html>
